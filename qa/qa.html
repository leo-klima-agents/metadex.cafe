<!doctype html>
<!-- The QA wallet's window, beside the page: each control calls qa(), which qa.ts answers with the state. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QA wallet</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px system-ui;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 13px;
        color: GrayText;
      }
      section {
        border-top: 1px solid GrayText;
        padding: 8px 0;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      .hint {
        color: GrayText;
        font-size: 12px;
      }
      .failed {
        color: #b3261e;
      }
      #prompts li {
        border: 2px solid;
        padding: 8px;
        margin: 8px 0;
      }
      #prompts,
      #log {
        padding-inline-start: 16px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>QA wallet</h1>
    <p id="status" role="status"></p>

    <section>
      <h2>Scenario</h2>
      <select id="scenarios" aria-label="Scenario" onchange="run('state')"></select>
      <button onclick="run('start', scenarios.value)">Start</button>
      <p class="hint" id="title"></p>
      <p class="hint">Starting one, even the same, forks Base again: it undoes every change.</p>
    </section>

    <section>
      <h2>Wallet</h2>
      <ol id="prompts" aria-label="Waiting for you"></ol>
      <label
        >Signs as
        <select id="owner" onchange="run('owner', owner.value)"></select
      ></label>
      <p class="hint" id="holds"></p>
      <form onsubmit="(event.preventDefault(), run('owner', address.value))">
        <input id="address" placeholder="Or any address, 0x…" aria-label="Address" size="44" />
        <button>Sign as it</button>
      </form>
      <label>
        Network
        <select id="chain" onchange="run('chain', chain.value)">
          <option value="8453">Base</option>
          <option value="1">Ethereum</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="asks" onchange="run('asks', asks.checked)" />
        Asks you before it connects, switches or sends
      </label>
      <label>
        Calls
        <select id="calls" onchange="run('calls', calls.value)">
          <option value="one">One per prompt</option>
          <option value="atomic">Several in one prompt, all or nothing</option>
          <option value="each">Several in one prompt, one by one</option>
        </select>
      </label>
      <p class="hint">The page asks how a wallet sends calls once per address: reload it after a change.</p>
    </section>

    <section>
      <h2>Open the page</h2>
      <button onclick="run('open', 'wallet')">With this wallet</button>
      <button onclick="run('open', 'safe')">In Safe{Wallet}, as a Safe</button>
      <button onclick="run('open', 'none')">Without a wallet</button>
    </section>

    <section>
      <h2>Base</h2>
      <p id="time"></p>
      <button onclick="run('travel')">Next epoch</button>
      <button id="replay" onclick="run('replay')" hidden></button>
      <p class="hint">Nobody votes or pays on the fork unasked.</p>
    </section>

    <section>
      <h2>What the wallet was asked</h2>
      <ol id="log" reversed></ol>
    </section>

    <script>
      const $ = (id) => document.getElementById(id);
      const date = new Intl.DateTimeFormat("en-GB", { dateStyle: "medium", timeStyle: "short", timeZone: "UTC" });
      let shown = {};
      let refused = "";

      // Whether a part has something new to show. A select is set only then, so that the next poll does not undo what
      // was just picked.
      function changed(key, value) {
        const text = JSON.stringify(value);
        if (shown[key] === text) return false;
        shown[key] = text;
        return true;
      }
      function fill(select, value, items) {
        if (document.activeElement === select) return;
        if (items && changed(select.id, items))
          select.replaceChildren(...items.map(([value, text]) => new Option(text, value)));
        else if (!changed(`${select.id}=`, value)) return;
        select.value = value;
      }
      function li(...children) {
        const item = document.createElement("li");
        item.append(...children);
        return item;
      }
      const button = (textContent, onclick) =>
        Object.assign(document.createElement("button"), { textContent, onclick });
      const answer = (id, yes) => button(yes ? "Approve" : "Decline", () => run("answer", id, yes));

      function render(state) {
        $("status").textContent = state.busy || state.failure || refused;
        $("status").className = !state.busy && (state.failure || refused) ? "failed" : "";
        for (const control of document.querySelectorAll("button, select, input")) control.disabled = !!state.busy;
        const names = state.scenarios.map(({ name }) => [name, name]);
        fill($("scenarios"), state.scenario, names);
        $("title").textContent = state.scenarios.find(({ name }) => name === $("scenarios").value)?.title ?? "";
        const owners = state.owners.map(({ address, short, holds }) => [address, `${short} · ${holds}`]);
        fill($("owner"), state.owner, owners);
        $("holds").textContent = state.owners.find(({ address }) => address === state.owner)?.holds ?? "";
        fill($("chain"), String(state.chainId));
        fill($("calls"), state.calls);
        if (changed("asks", state.asks)) $("asks").checked = state.asks;
        $("time").textContent = state.time ? `${date.format(state.time * 1000)} UTC · block ${state.block}` : "";
        $("replay").hidden = !state.replays;
        if (state.replays) {
          const { next, sent, total } = state.replays;
          $("replay").textContent = `The operator ${next ?? "is done"} (${sent} of ${total} sent)`;
          $("replay").disabled ||= !next;
        }
        if (changed("prompts", state.prompts))
          $("prompts").replaceChildren(
            ...state.prompts.map(({ id, text }) => li(text, " ", answer(id, true), " ", answer(id, false))),
          );
        if (changed("log", state.log)) $("log").replaceChildren(...state.log.map((line) => li(line)));
      }

      async function run(command, ...args) {
        try {
          const state = await window.qa(command, ...args);
          if (command !== "state") refused = "";
          render(state);
        } catch (error) {
          const why = String(error.message ?? error).replace(/^Error: /, "");
          if (command !== "state") refused = why;
          $("status").textContent = why;
          $("status").className = "failed";
          // Forget what was shown, so that the next render resets a control whose change failed.
          shown = {};
        }
      }
      run("state");
      setInterval(() => run("state"), 1000);
    </script>
  </body>
</html>
