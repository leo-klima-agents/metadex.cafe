name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          npm run release
          unzip -q release/*.zip -d "$RUNNER_TEMP/unzipped"
          diff -r dist "$RUNNER_TEMP"/unzipped/*/
      # The build is reproducible: a fresh clone gives the same files, CAR, zip and notes.
      - run: |
          git clone --quiet . "$RUNNER_TEMP/second"
          cd "$RUNNER_TEMP/second"
          npm ci --ignore-scripts
          npm run build
          npm run release
          diff -r "$GITHUB_WORKSPACE/dist" dist
          diff -r "$GITHUB_WORKSPACE/release" release
      - if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  # The forks' answers from Base are cached from run to run; a saved key cannot be saved again, hence one per attempt.
  fork:
    concurrency: fork-${{ github.head_ref || github.ref_name }}
    runs-on: ubuntu-26.04
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.7
      - run: npm ci --ignore-scripts
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/metadex.cafe/fork
          key: fork-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fork-
      - run: touch "$RUNNER_TEMP/started"
      - run: npm run test:fork
      - id: cache
        if: always()
        run:
          find ~/.cache/metadex.cafe/fork -type f -newer "$RUNNER_TEMP/started" | grep -q . && echo added=true >>
          "$GITHUB_OUTPUT" || true
      - if: always() && steps.cache.outputs.added == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/metadex.cafe/fork
          key: fork-${{ github.run_id }}-${{ github.run_attempt }}

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, fork]
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency: pages
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
      # Pages serves exactly the build; the query string skips the CDN's older copies.
      - env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          mkdir site && tar -xf artifact.tar -C site && cd site
          for file in $(find . -type f | sort); do
            curl -fsS --retry 5 "$URL${file#./}?$GITHUB_SHA" | cmp - "$file"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, fork]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/*.car release/*.zip --notes-file release/notes.md
